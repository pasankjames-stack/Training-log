    const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    calPts.push({ label: prettyShort(iso), value: kcalByDate[iso] || 0 });
  }
  _calPts = calPts.some(p => p.value > 0) ? calPts : [];
  html += proteinCardHtml(today);
  html += `<div class="card" id="calCard"><h2>Calories</h2>
    <div class="calbody">${barChart(_calPts, { target: 2000, height: CAL_MAX_H, empty: "No meals logged in the last 7 days." })}</div></div>`;

  // Buttons in two rows (Log + Meals, then History / Routines / Weight);
  // the calorie chart shrinks to make room so nothing else changes size
  html += `<div class="navwrap">
      <div class="navrow two">
        <button class="navtile" data-go="log"><span class="nt-name">Log</span></button>
        <button class="navtile" data-go="meals"><span class="nt-name">Meals</span></button>
      </div>
      <div class="navrow three">
        <button class="navtile" data-go="history"><span class="nt-name">History</span></button>
        <button class="navtile" data-go="edit"><span class="nt-name">Routines</span></button>
        <button class="navtile" data-go="weight"><span class="nt-name">Weight</span></button>
      </div>
    </div>`;

  view.innerHTML = html;
  view.querySelectorAll(".navtile").forEach(b => b.onclick = () => goTab(b.dataset.go));
  const tdGo = document.getElementById("tdGo");
  if (tdGo) tdGo.onclick = () => startWorkout(tdGo.dataset.day);
  fitHome();
}

// Make the home page fit the phone exactly:
//  - small phone, page would scroll → shrink the calorie chart (down to a minimum)
//  - bigger phone → the calorie chart grows into the spare room so the sections
//    sit at normal spacing; Volume / Weight charts always keep their fixed size
// Heights are in chart units (charts are 320 units wide and scale to the card).
const CAL_MAX_H = 110, CAL_MIN_H = 70, CAL_GROW_MAX_H = 320;
const SMALL_BASE_H = 120;   // Volume / Weight charts: fixed size
let _calPts = [], _volPts = [], _wPts = [];
function volChartHtml(h) { return scatterChart(_volPts, { height: h, empty: "No sessions yet." }); }
function weightChartHtml(h) { return scatterChart(_wPts, { height: h, zeroBase: false, target: WEIGHT_GOAL, unit: " kg", empty: "No data yet." }); }
function fitHome() {
  if (currentTab !== "home") return;
  const card = document.getElementById("calCard");
  const svg = card && card.querySelector("svg.chart");
  if (!svg || !_calPts.length) return;
  const wpx = svg.getBoundingClientRect().width || 320;
  const over = document.documentElement.scrollHeight - window.innerHeight;
  let h;
  if (over > 0) {
    h = Math.max(CAL_MIN_H, CAL_MAX_H - Math.ceil(over * 320 / wpx));
  } else {
    // Spare height = the view's height minus what its sections actually need
    let used = 0;
    [...view.children].forEach(el => { used += el.offsetHeight + (parseFloat(getComputedStyle(el).marginBottom) || 0); });
    const slack = view.getBoundingClientRect().height - used;
    if (slack <= 4) return;
    h = Math.min(CAL_GROW_MAX_H, CAL_MAX_H + Math.floor((slack - 2) * 320 / wpx));
  }
  card.querySelector(".calbody").innerHTML =
    barChart(_calPts, { target: 2000, height: h, empty: "No meals logged in the last 7 days." });
}

// Log tab, step 1: just the routines. Exercises appear once one is tapped.
function renderLogPicker() {
  let html = `<div class="logpick">Choose a routine</div><div class="days">`;
  DAYS.forEach(day => {
    const going = day === currentDay && draftDirty;
    const last = lastSession(day);
    const lastTxt = going ? "in progress" : (last ? `last ${prettyDate(last.date)}` : "not logged yet");
    html += `<button class="day ${going?"on":""}" data-day="${escAttr(day)}">
      <div class="dname">${escHtml(day)}</div>
      <div class="dfocus">${escHtml(plan[day].focus || "")}</div>
      <div class="dlast${going?" going":""}">${lastTxt}</div>
    </button>`;
  });
  html += "</div>";
  view.innerHTML = html;
  view.querySelectorAll(".day").forEach(b => b.onclick = () => {
    const day = b.dataset.day;
    // Re-opening the routine you're midway through keeps what you've typed
    if (day !== currentDay || !draftDirty) { currentDay = day; buildDraft(currentDay); }
    logPicked = true;
    render();
    window.scrollTo(0, 0);
  });
}

// Log tab, step 2: the chosen routine's exercises
function renderLog() {
  if (!logPicked || !plan[currentDay]) { logPicked = false; renderLogPicker(); return; }
  reconcileDraft(currentDay);
  const dp = plan[currentDay];
  let html = `<button class="backbtn" id="logBack">← All routines</button>
    <div class="loghead"><div class="lh-name">${escHtml(currentDay)}</div>${dp.focus ? `<div class="lh-focus">${escHtml(dp.focus)}</div>` : ""}</div>`;
  if (!dp.ex.length) html += `<div class="empty"><div class="big">No exercises yet</div>Add some in Routines.</div>`;

  dp.ex.forEach(ex => {
    const last = lastForExercise(ex);
    const sug = suggestion(ex, last && last.sets);
    const targetStr = ex.type === "sec"
      ? `${ex.sets} × ${ex.lo}–${ex.hi}s`
      : (ex.lo === ex.hi ? `${ex.sets} × ${ex.lo}` : `${ex.sets} × ${ex.lo}–${ex.hi}`);
    const u = unitLabel(ex);
    const showWeight = ex.type === "kg";

    let rows = `<div class="set-head"><span></span><span>${showWeight?"weight":"&nbsp;"}</span><span>${u==="kg"?"reps":u}</span></div>`;
    draft[ex.id].forEach((s, i) => {
      rows += `<div class="set-row">
        <div class="set-no">${i+1}</div>
        ${showWeight
          ? `<div class="field"><input inputmode="decimal" data-ex="${ex.id}" data-i="${i}" data-k="w" value="${s.w}" placeholder="–"><span class="unit">kg</span></div>`
          : `<div class="field"><input value="BW" disabled style="color:var(--ink-faint)"></div>`}
        <div class="field"><input inputmode="numeric" data-ex="${ex.id}" data-i="${i}" data-k="r" value="${s.r}" placeholder="–"><span class="unit">${u==="kg"?"reps":u}</span></div>
      </div>`;
    });

    html += `<div class="ex">
      <div class="ex-top"><div class="ex-name">${ex.name}</div><div class="ex-target">${targetStr}</div></div>
      ${ex.note ? `<div class="ex-note">${ex.note}</div>` : ""}
      ${lastLineHtml(ex, last)}
      <span class="chip ${sug.cls}">${sug.text}</span>
      <div class="sets">${rows}</div>
      <div class="setctl">
        <button class="setbtn rem" data-rem="${ex.id}" ${draft[ex.id].length<=1?"disabled":""}>− Remove set</button>
        <button class="setbtn add" data-add="${ex.id}">+ Add set</button>
      </div>
    </div>`;
  });

  view.innerHTML = html;

  document.getElementById("logBack").onclick = () => { logPicked = false; render(); window.scrollTo(0, 0); };
  view.querySelectorAll("input[data-ex]").forEach(inp => {
    inp.oninput = () => { draft[inp.dataset.ex][+inp.dataset.i][inp.dataset.k] = inp.value; draftDirty = true; };
  });
  view.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    draft[b.dataset.add].push({ w:"", r:"" }); draftDirty = true; render();
  });
  view.querySelectorAll("[data-rem]").forEach(b => b.onclick = () => {
    const arr = draft[b.dataset.rem];
    if (arr.length > 1) { arr.pop(); draftDirty = true; render(); }
  });
}

async function saveSession() {
  if (!logPicked || !plan[currentDay]) return;
  const exObj = {};
  let any = false;
  plan[currentDay].ex.forEach(ex => {
    exObj[ex.id] = draft[ex.id].map(s => {
      const w = ex.type === "kg" ? (s.w === "" ? "" : +s.w) : 0;
      const r = s.r === "" ? "" : +s.r;
      if (r !== "") any = true;
      return { w, r };
    });
  });
  const hint = document.getElementById("saveHint");
  if (!any) { hint.textContent = "Enter at least one set first."; return; }

  // Replace a same-day same-type entry made today, else append
  const today = isoToday();
  const idx = data.sessions.findIndex(s => s.date === today && s.day === currentDay);
  const entry = { date: today, day: currentDay, ex: exObj };
  if (idx >= 0) data.sessions[idx] = entry; else data.sessions.push(entry);

  const ok = await persist();
  if (ok) { syncToSheet(); draftDirty = false; }
  hint.textContent = ok
    ? (SHEET_SYNC_URL ? "Saved ✓  — synced to your sheet" : "Saved ✓  — carried into your history")
    : "Couldn't save — try again";
  if (ok) setTimeout(() => { hint.textContent = ""; render(); }, 1200);
}

function renderHistory() {
  if (data.sessions.length === 0) {
    view.innerHTML = `<div class="empty"><div class="big">No sessions yet</div>Log a workout and it'll show up here.</div>`;
    return;
  }
  const sorted = [...data.sessions].sort((a,b) => b.date.localeCompare(a.date));
  let html = '';
  sorted.forEach((s, si) => {
    let body = "";
    sessionExercises(s).forEach(ex => {
      const sets = s.ex[ex.id];
      const val = sets.map(x => {
        if (ex.type === "kg") return `${x.w||"–"}×${x.r||"–"}`;
        if (ex.type === "sec") return `${x.r||"–"}s`;
        return `${x.r||"–"}`;
      }).join("  ");
      body += `<div class="hex"><span class="hn">${escHtml(ex.name)}</span><span class="hv">${val}</span></div>`;
    });
    const confirming = (s.date + "|" + s.day) === histDeleteKey;
    body += confirming
      ? `<div class="me-delconfirm">
          <span class="me-delq">Delete this workout?</span>
          <button class="me-delyes" data-hdelyes="${si}">Delete</button>
          <button class="me-delno" data-hdelno="1">Cancel</button>
        </div>`
      : `<button class="hdel" data-hdel="${si}">Delete workout</button>`;
    html += `<div class="hentry" data-h="${si}">
      <div class="hentry-top"><div class="hday">${escHtml(s.day)}</div><div class="hdate">${prettyDate(s.date)}</div></div>
      <div class="hbody${confirming ? " open" : ""}" id="hb-${si}">${body}</div>
    </div>`;
  });
  html += exerciseProgressHtml();
  html += `<button class="toolbtn" id="exportBtn">Export to CSV (copy for Google Sheets)</button>`;
  html += `<div id="exportOut"></div>`;
  html += `<div id="resetZone"><button class="toolbtn danger" id="resetBtn">Clear all data</button></div>`;
  view.innerHTML = html;

  view.querySelectorAll(".hentry").forEach(h => h.onclick = () => {
    document.getElementById("hb-" + h.dataset.h).classList.toggle("open");
  });
  view.querySelectorAll(".exhead").forEach(b => b.onclick = () => {
    document.getElementById("exb-" + b.dataset.exkey).classList.toggle("open");
  });
  // Delete a workout (buttons sit inside the tappable entry, so stop the tap toggling it)
  view.querySelectorAll("[data-hdel]").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const s = sorted[+b.dataset.hdel]; histDeleteKey = s.date + "|" + s.day; renderHistory();
  });
  view.querySelectorAll("[data-hdelyes]").forEach(b => b.onclick = (e) => {
    e.stopPropagation(); deleteWorkout(sorted[+b.dataset.hdelyes]);
  });
  view.querySelectorAll("[data-hdelno]").forEach(b => b.onclick = (e) => {
    e.stopPropagation(); histDeleteKey = null; renderHistory();
  });
  document.getElementById("exportBtn").onclick = exportCSV;
  document.getElementById("resetBtn").onclick = armReset;
}

// Remove one workout locally, then re-sync the log so the sheet drops it too
// (the sheet's Log is rewritten from the app on every sync).
async function deleteWorkout(target) {
  data.sessions = data.sessions.filter(s => !(s.date === target.date && s.day === target.day));
  histDeleteKey = null;
  await persist();
  syncToSheet();
  if (currentDay === target.day && !draftDirty) buildDraft(currentDay);   // refresh "last time" prefill
  render();
}

function buildCSV() {
  const rows = [["date","day","exercise","set","weight_kg","reps_or_sec"]].concat(sessionRows());
  return rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
}

async function exportCSV() {
  const csv = buildCSV();
  let copied = false;
  try { await navigator.clipboard.writeText(csv); copied = true; } catch (e) { /* clipboard blocked — fall back to manual copy */ }
  const out = document.getElementById("exportOut");
  out.innerHTML = `<div class="csvhint">${copied
      ? "Copied to clipboard ✓ — open a Google Sheet and paste. Or copy again from the box below."
      : "Tap inside the box, select all, and copy — then paste into a Google Sheet."}</div>
    <textarea class="csvbox" readonly>${csv.replace(/</g,"&lt;")}</textarea>`;
  const ta = out.querySelector("textarea");
  ta.focus(); ta.select();
}

function armReset() {
  const zone = document.getElementById("resetZone");
  zone.innerHTML = `<div class="confirm">Clear every logged session? This can't be undone.</div>
    <button class="toolbtn danger" id="resetYes">Yes, clear everything</button>
    <button class="toolbtn" id="resetNo">Cancel</button>`;
  document.getElementById("resetYes").onclick = doReset;
  document.getElementById("resetNo").onclick = () => render();
}

async function doReset() {
  data = { sessions: [], seeded: true };   // stay empty, don't re-seed on reload
  await persist();
  syncToSheet();
  buildDraft(currentDay);
  render();
}

// ---------- Dashboard helpers ----------
function daysAgo(dateStr) {
  const d = new Date(dateStr + "T00:00:00"), now = new Date();
  return Math.round((now.setHours(0,0,0,0) - d.setHours(0,0,0,0)) / 86400000);
}
function prettyShort(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString(undefined, { day:"numeric", month:"short" });
}
// One entry per session, with total weighted volume (weight × reps)
function dashSessions() {
  return data.sessions.map(s => {
    const dp = plan[s.day]; let vol = 0;
    if (dp) dp.ex.forEach(ex => {
      if (ex.type !== "kg") return;
      const sets = s.ex[ex.id]; if (!sets) return;
      sets.forEach(x => { vol += (+x.w || 0) * (+x.r || 0); });
    });
    return { date: s.date, day: s.day, volume: vol };
  }).sort((a,b) => a.date.localeCompare(b.date));
}
// Hand-drawn SVG line/area chart of volume over time
function volumeChart(sessions) {
  if (sessions.length < 2) {
    const v = sessions.length ? Math.round(sessions[0].volume).toLocaleString() : 0;
    return `<div style="font-family:var(--mono);font-size:12px;color:var(--ink-soft);padding:6px 0">
      ${v} kg so far — log another session to start the trend.</div>`;
  }
  const W = 320, H = 120, padL = 6, padR = 6, padT = 16, padB = 18;
  const vals = sessions.map(s => s.volume);
  const max = Math.max(...vals), min = Math.min(...vals, 0);
  const span = (max - min) || 1;
  const x = i => padL + (i * (W - padL - padR)) / (sessions.length - 1);
  const y = v => padT + (1 - (v - min) / span) * (H - padT - padB);
  let line = "", area = `M ${x(0)} ${H - padB}`;
  sessions.forEach((s, i) => {
    const px = x(i), py = y(s.volume);
    line += (i ? " L " : "M ") + px.toFixed(1) + " " + py.toFixed(1);
    area += ` L ${px.toFixed(1)} ${py.toFixed(1)}`;
  });
  area += ` L ${x(sessions.length - 1)} ${H - padB} Z`;
  let dots = "", labels = "";
  sessions.forEach((s, i) => {
    const lastOne = i === sessions.length - 1;
    const show = sessions.length <= 8 || i === 0 || lastOne || i === Math.floor(sessions.length / 2);
    dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(s.volume).toFixed(1)}" r="${lastOne ? 3.5 : 2.2}" fill="${lastOne ? 'var(--accent)' : 'var(--ink-faint)'}"/>`;
    if (show) labels += `<text class="axis" x="${x(i).toFixed(1)}" y="${H - 5}" text-anchor="middle">${prettyShort(s.date)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <path d="${area}" fill="var(--accent)" opacity="0.08"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
  </svg>`;
}

function renderDashboard() {
  if (!data.sessions.length) {
    view.innerHTML = `<div class="empty"><div class="big">No sessions yet</div>Log a workout and your dashboard fills in.</div>`;
    return;
  }
  const sessions = dashSessions();
  const totalVol = sessions.reduce((a, x) => a + x.volume, 0);
  const last = sessions[sessions.length - 1];
  const ago = daysAgo(last.date);
  const lastTxt = ago <= 0 ? "Today" : ago === 1 ? "Yesterday" : ago + " days ago";
  const week = sessions.filter(s => daysAgo(s.date) <= 6).length;

  let html = `<div class="stats">
    <div class="stat"><div class="lbl">Sessions</div><div class="val">${sessions.length}</div></div>
    <div class="stat"><div class="lbl">Last 7 days</div><div class="val">${week} <small>session${week===1?"":"s"}</small></div></div>
    <div class="stat"><div class="lbl">Total volume</div><div class="val">${Math.round(totalVol).toLocaleString()} <small>kg</small></div></div>
    <div class="stat"><div class="lbl">Last trained</div><div class="val" style="font-size:18px">${lastTxt}</div></div>
  </div>`;

  html += `<div class="card"><h2>Volume per session</h2>
    <div class="csub">Total weight moved (weight × reps) each session</div>
    ${volumeChart(sessions.slice(-14))}</div>`;

  // Per-exercise top working weight
  const weighted = [];
  DAYS.forEach(day => plan[day].ex.forEach(ex => { if (ex.type === "kg") weighted.push({ day, ex }); }));
  let bodyEx = "";
  weighted.forEach(({day, ex}) => {
    const hist = data.sessions.filter(s => s.day === day && s.ex[ex.id])
      .sort((a,b) => a.date.localeCompare(b.date))
      .map(s => ({ date: s.date, w: Math.max(...s.ex[ex.id].map(x => +x.w || 0)) }));
    if (!hist.length) return;
    const max = Math.max(...hist.map(h => h.w), 1);
    let bars = "", dates = "";
    hist.slice(-6).forEach((h, i, arr) => {
      const isLast = i === arr.length - 1;
      const ht = Math.max(8, (h.w / max) * 100);
      bars += `<div class="pbar ${isLast?"last":""}" style="height:${ht}%"><span class="pv">${h.w}</span></div>`;
      dates += `<span>${prettyShort(h.date)}</span>`;
    });
    bodyEx += `<div class="pcard"><div class="pname">${ex.name} <span style="color:var(--ink-faint);font-weight:400">· ${day}</span></div>
      <div class="ptrack">${bars}</div><div class="pdates">${dates}</div></div>`;
  });
  if (bodyEx) html += `<div class="seclabel">Working weight by exercise</div>` + bodyEx;

  view.innerHTML = html;
}

// ---------- Edit / routine builder ----------
function renderEdit() {
  if (editingDay && !plan[editingDay]) editingDay = null;
  if (!editingDay) renderEditDayList();
  else renderEditDay(editingDay);
}

function renderEditDayList() {
  let html = `<div class="editintro">Build your routine here. Changes apply instantly and save on this device.</div>`;
  DAYS.forEach(day => {
    const n = plan[day].ex.length;
    html += `<div class="edcard" data-eday="${escAttr(day)}">
      <div class="edhead"><span class="edname">${escHtml(day)}</span><span class="edcount">${n} exercise${n===1?"":"s"} \u203a</span></div>
      ${plan[day].focus ? `<div class="edfocus">${escHtml(plan[day].focus)}</div>` : ""}
    </div>`;
  });
  html += `<button class="toolbtn" id="addDayBtn">+ Add training day</button>`;
  html += `<div id="resetPlanZone"><button class="toolbtn danger" id="resetPlanBtn">Reset to the default plan</button></div>`;
  view.innerHTML = html;
  view.querySelectorAll("[data-eday]").forEach(c => c.onclick = () => { editingDay = c.dataset.eday; pickingExercise = false; render(); });
  document.getElementById("addDayBtn").onclick = addDay;
  document.getElementById("resetPlanBtn").onclick = armResetPlan;
}

function addDay() {
  let name = "New Day", i = 2;
  while (plan[name]) name = "New Day " + (i++);
  plan[name] = { focus: "", ex: [] };
  refreshDays(); savePlan(); editingDay = name; render();
}

function renderEditDay(day) {
  const d = plan[day];
  let html = `<button class="backbtn" id="backDays">\u2190 All days</button>`;
  html += `<div class="edfield"><label>Day name</label><input id="dayName" value="${escAttr(day)}" /></div>`;
  html += `<div class="edfield"><label>Focus (the small subtitle)</label><input id="dayFocus" value="${escAttr(d.focus || "")}" placeholder="e.g. Quads \u00b7 hamstrings \u00b7 core" /></div>`;
  html += `<div class="seclabel">Exercises</div>`;
  d.ex.forEach((ex, i) => { html += exerciseEditor(ex, i); });
  if (pickingExercise) html += exercisePickerHtml();
  else html += `<button class="toolbtn" id="addExBtn">+ Add exercise</button>`;
  html += `<div id="delDayZone"><button class="toolbtn danger" id="delDayBtn">Delete this day</button></div>`;
  view.innerHTML = html;
  wireEditDay(day);
}

function exerciseEditor(ex, i) {
  const opt = (v, l) => `<option value="${v}" ${ex.type === v ? "selected" : ""}>${l}</option>`;
  return `<div class="excard">
    <input class="exname" data-i="${i}" data-f="name" value="${escAttr(ex.name || "")}" placeholder="Exercise name" />
    <div class="exrow">
      <div class="exfld"><label>Sets</label><input inputmode="numeric" data-i="${i}" data-f="sets" value="${ex.sets}" /></div>
      <div class="exfld"><label>Reps from</label><input inputmode="numeric" data-i="${i}" data-f="lo" value="${ex.lo}" /></div>
      <div class="exfld"><label>to</label><input inputmode="numeric" data-i="${i}" data-f="hi" value="${ex.hi}" /></div>
    </div>
    <div class="exfld"><label>Type</label>
      <select data-i="${i}" data-f="type">${opt("kg","Weighted (kg)")}${opt("bw","Bodyweight reps")}${opt("sec","Hold (seconds)")}</select>
    </div>
    <input class="exnote" data-i="${i}" data-f="note" value="${escAttr(ex.note || "")}" placeholder="Note (optional)" />
    <button class="exdel" data-del="${i}">Remove exercise</button>
  </div>`;
}

function exercisePickerHtml() {
  return `<div class="picker">
    <div class="picker-top">Add an exercise</div>
    <input id="pickSearch" class="pickinput" placeholder="Search by name or muscle…" autocomplete="off" autocapitalize="none">
    <div id="pickResults" class="pickresults"></div>
    <button class="pickcustom" id="pickCustom">+ Blank custom exercise</button>
    <button class="pickcancel" id="pickCancel">Cancel</button>
  </div>`;
}
function pickResultsHtml(q) {
  if (!exerciseList.length) return `<div class="pickempty">No exercise list yet. Add an “Exercises” tab to your sheet, or add a blank one below.</div>`;
  q = (q || "").trim().toLowerCase();
  if (!q) return `<div class="pickhint">Start typing to search your ${exerciseList.length} exercises.</div>`;
  const matches = exerciseList
    .map((e, i) => ({ e, i }))
    .filter(o => (o.e.name || "").toLowerCase().includes(q) || (o.e.muscle || "").toLowerCase().includes(q));
  if (!matches.length) return `<div class="pickempty">No match for “${escHtml(q)}”.</div>`;
  let h = "";
  matches.slice(0, 12).forEach(({ e, i }) => {
    const reps = e.lo === e.hi ? e.lo : e.lo + "\u2013" + e.hi;
    const ut = e.type === "sec" ? "sec" : (e.type === "bw" ? "bodyweight" : "kg");
    const mus = e.muscle ? " \u00b7 " + escHtml(e.muscle) : "";
    h += `<button class="pickitem" data-pick="${i}">
      <span class="pi-name">${escHtml(e.name)}</span>
      <span class="pi-meta">${ut} \u00b7 ${e.sets}\u00d7${reps}${mus}</span>
    </button>`;
  });
  return h;
}

function wireEditDay(day) {
  document.getElementById("backDays").onclick = () => { savePlan(); editingDay = null; pickingExercise = false; render(); };

  const nameInp = document.getElementById("dayName");
  nameInp.onchange = () => {
    const nn = nameInp.value.trim();
    if (!nn || nn === day) return;
    if (plan[nn]) { nameInp.value = day; return; }   // name already used
    const newPlan = {};
    DAYS.forEach(k => { newPlan[k === day ? nn : k] = plan[k]; });
    plan = newPlan;
    data.sessions.forEach(sn => { if (sn.day === day) sn.day = nn; });   // keep history attached
    if (currentDay === day) currentDay = nn;
    editingDay = nn;
    refreshDays(); savePlan(); render();
  };

  document.getElementById("dayFocus").oninput = (e) => { plan[editingDay].focus = e.target.value; savePlan(); };

  view.querySelectorAll(".excard input, .excard select").forEach(el => {
    const handler = () => {
      const ex = plan[editingDay].ex[+el.dataset.i], f = el.dataset.f;
      if (f === "sets" || f === "lo" || f === "hi") {
        const v = parseInt(el.value, 10);
        if (!isNaN(v) && v > 0) ex[f] = v;
      } else ex[f] = el.value;
      savePlan();
    };
    if (el.tagName === "SELECT") el.onchange = handler; else el.oninput = handler;
  });

  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    plan[editingDay].ex.splice(+b.dataset.del, 1); savePlan(); render();
  });

  if (pickingExercise) {
    const search = document.getElementById("pickSearch");
    const results = document.getElementById("pickResults");
    const renderResults = () => {
      results.innerHTML = pickResultsHtml(search ? search.value : "");
      results.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
        const e = exerciseList[+b.dataset.pick]; if (!e) return;
        plan[editingDay].ex.push({ id: slug(e.name), name: e.name, sets: e.sets || 3, lo: e.lo || 8, hi: e.hi || 12, type: e.type || "kg", note: e.note || "" });
        pickingExercise = false; savePlan(); render();
      });
    };
    if (search) { search.oninput = renderResults; search.focus(); }
    renderResults();
    const pc = document.getElementById("pickCustom");
    if (pc) pc.onclick = () => { plan[editingDay].ex.push({ id: uid(), name: "", sets: 3, lo: 8, hi: 12, type: "kg", note: "" }); pickingExercise = false; savePlan(); render(); };
    const px = document.getElementById("pickCancel");
    if (px) px.onclick = () => { pickingExercise = false; render(); };
  } else {
    const addBtn = document.getElementById("addExBtn");
    if (addBtn) addBtn.onclick = () => { pickingExercise = true; render(); refreshExercises(); };
  }

  document.getElementById("delDayBtn").onclick = () => {
    const zone = document.getElementById("delDayZone");
    zone.innerHTML = `<div class="confirm">Delete \u201c${escHtml(day)}\u201d? Logged history stays saved but won't be shown.</div>
      <button class="toolbtn danger" id="delYes">Yes, delete day</button>
      <button class="toolbtn" id="delNo">Cancel</button>`;
    document.getElementById("delYes").onclick = () => {
      delete plan[day]; refreshDays(); savePlan(); editingDay = null; render();
    };
    document.getElementById("delNo").onclick = () => render();
  };
}

function armResetPlan() {
  const zone = document.getElementById("resetPlanZone");
  zone.innerHTML = `<div class="confirm">Replace your routine with the original default plan? This won't touch your logged sessions.</div>
    <button class="toolbtn danger" id="rpYes">Yes, reset plan</button>
    <button class="toolbtn" id="rpNo">Cancel</button>`;
  document.getElementById("rpYes").onclick = () => {
    plan = JSON.parse(JSON.stringify(DEFAULT_PLAN));
    refreshDays(); savePlan(); editingDay = null; render();
  };
  document.getElementById("rpNo").onclick = () => render();
}

// ---------- Meals (photo → detect → confirm → estimate) ----------
const MEALS_KEY = "ulp-meals-v1";
let meals = [];
let mealStage = "idle";        // idle | detecting | confirming | estimating
let pendingTs = null;
let pendingItems = [];
let pendingNote = "";
let mealDeleteTs = null;       // ts of the meal currently asking "delete?"
let pendingOil = "unsure";     // none | little | lot | unsure
let pendingDate = null;        // date for the meal being confirmed (editing keeps the original)
let pendingReplaceTs = null;   // when editing, the ts of the meal being replaced
let mealOpenTs = null;         // ts of the meal whose breakdown is expanded
const OIL_CHOICES = [["none","None"],["little","A little"],["lot","A lot"],["unsure","Not sure"]];

function loadMealsCache() {
  try { const v = localStorage.getItem(MEALS_KEY); if (v) meals = JSON.parse(v); } catch (e) {}
}
function cacheMeals() { try { localStorage.setItem(MEALS_KEY, JSON.stringify(meals)); } catch (e) {} }
function mapMealRows(rows) {
  return rows.map(r => {
    let items = null;
    try { if (r[5]) items = JSON.parse(r[5]); } catch (e) { items = null; }
    // sugar = added sugar in g; null for meals estimated before sugar was tracked
    const sugar = (r[6] === "" || r[6] == null || isNaN(+r[6])) ? null : +r[6];
    return { ts:+r[0], date:r[1], label:r[2], kcal:r[3], protein:r[4], items, sugar };
  }).sort((a, b) => b.ts - a.ts);
}
function resetPendingMeal() {
  pendingTs = null; pendingItems = []; pendingNote = "";
  pendingOil = "unsure"; pendingDate = null; pendingReplaceTs = null;
}

function fileToCompressedBase64(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", quality).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
    img.src = url;
  });
}

function mealHint(msg) { const h = document.getElementById("mealHint"); if (h) h.textContent = msg || ""; }

function postDetect(b64, ts) {
  try {
    fetch(SHEET_SYNC_URL, { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "detectMeal", token: APP_TOKEN, ts, image: b64 }) });
  } catch (e) {}
}
function pollDetect(ts, tries) {
  jsonp(SHEET_SYNC_URL + "?action=getPending&ts=" + ts, (err, payload) => {
    if (mealStage !== "detecting" || pendingTs !== ts) return;
    if (!err && payload && payload.items) {
      pendingItems = payload.items.map(it => ({ name: it.name || "", qty: (it.qty != null ? it.qty : ""), unit: it.unit || "g" }));
      pendingNote = "";
      mealStage = "confirming";
      renderMeals();
      return;
    }
    if (tries <= 0) { mealStage = "idle"; resetPendingMeal(); renderMeals(); mealHint("Couldn't detect that photo — check Executions, or try again."); return; }
    setTimeout(() => pollDetect(ts, tries - 1), 2500);
  });
}

function postFinalize(ts, date, items, note, oil, replaceTs) {
  try {
    fetch(SHEET_SYNC_URL, { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "finalizeMeal", token: APP_TOKEN, ts, date, items, note, oil, replaceTs }) });
  } catch (e) {}
}
function pollForMeal(ts, tries, cb) {
  jsonp(SHEET_SYNC_URL + "?action=getMeals", (err, payload) => {
    if (!err && payload && payload.meals) {
      const found = payload.meals.find(r => +r[0] === ts);
      if (found) {
        meals = mapMealRows(payload.meals);
        cacheMeals(); cb(null, found); return;
      }
    }
    if (tries <= 0) { cb(new Error("timeout")); return; }
    setTimeout(() => pollForMeal(ts, tries - 1, cb), 2500);
  });
}

function fetchMeals(cb) {
  if (!SHEET_SYNC_URL) { if (cb) cb(); return; }
  jsonp(SHEET_SYNC_URL + "?action=getMeals", (err, payload) => {
    if (!err && payload && payload.meals) {
      meals = mapMealRows(payload.meals);
      cacheMeals();
    }
    if (cb) cb();
  });
}
function refreshMeals() { fetchMeals(() => {
  if (currentTab === "home") renderIfIdle();
  else if (currentTab === "meals" && mealStage === "idle") renderIfIdle();
}); }

async function onMealPhoto(e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  if (!SHEET_SYNC_URL) { mealHint("Sheet sync isn't set up."); return; }
  if (!APP_TOKEN) { mealHint("Set your APP_TOKEN in the code first."); return; }
  mealDeleteTs = null;
  let b64;
  try { b64 = await fileToCompressedBase64(f, 1024, 0.7); }
  catch (err) { mealHint("Couldn't read that photo — try again."); return; }
  resetPendingMeal();
  pendingTs = Date.now();
  mealStage = "detecting";
  renderMeals();
  postDetect(b64, pendingTs);
  pollDetect(pendingTs, 6);
}

// Manual entry — skip the photo/detect step and go straight to the
// confirm screen with one blank item for the user to describe.
function startManualMeal() {
  if (!SHEET_SYNC_URL) { mealHint("Sheet sync isn't set up."); return; }
  if (!APP_TOKEN) { mealHint("Set your APP_TOKEN in the code first."); return; }
  mealDeleteTs = null;
  resetPendingMeal();
  pendingTs = Date.now();
  pendingItems = [{ name:"", qty:"", unit:"g" }];
  mealStage = "confirming";
  renderMeals();
}

// Re-open a logged meal on the confirm screen with its itemised grams, so one
// wrong item can be fixed and the meal re-estimated (it replaces the old one).
function editMeal(ts) {
  const m = meals.find(x => +x.ts === +ts); if (!m) return;
  resetPendingMeal();
  mealDeleteTs = null;
  pendingTs = Date.now();
  pendingReplaceTs = m.ts;
  pendingDate = m.date || isoToday();
  if (m.items && m.items.length) {
    pendingItems = m.items.map(it => ({ name: it.name || "", qty: it.grams || "", unit: "g" }));
    pendingOil = "none";      // any oil the estimate added is already a line item
  } else {
    pendingItems = [{ name: m.label || "", qty: 1, unit: "serving" }];
  }
  mealStage = "confirming";
  renderMeals();
  window.scrollTo(0, 0);
}

function confirmMeal() {
  pendingItems = pendingItems.filter(it => String(it.name || "").trim());
  if (!pendingItems.length) { mealHint("Add at least one food first."); return; }
  const ts = pendingTs, date = pendingDate || isoToday();
  const items = pendingItems.slice(), note = pendingNote, oil = pendingOil, replaceTs = pendingReplaceTs;
  mealStage = "estimating";
  renderMeals();
  postFinalize(ts, date, items, note, oil, replaceTs);
  pollForMeal(ts, 12, (err) => {
    if (pendingTs !== ts) return;
    mealStage = "idle"; resetPendingMeal();
    if (!err) mealOpenTs = ts;     // show the new breakdown straight away
    renderMeals();
    if (err) mealHint("Still estimating — switch tabs and back to refresh.");
  });
}

function cancelMeal() {
  mealStage = "idle"; resetPendingMeal();
  renderMeals();
}

// Remove a meal locally + on the sheet. localStorage updates immediately;
// the sheet delete keeps it from reappearing on the next refresh.
function deleteMeal(ts) {
  meals = meals.filter(m => +m.ts !== +ts);
  cacheMeals();
  mealDeleteTs = null;
  pushMealDelete(ts);
  renderMeals();
}
function pushMealDelete(ts) {
  if (!SHEET_SYNC_URL) return;
  try {
    fetch(SHEET_SYNC_URL, { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "deleteMeal", token: APP_TOKEN, ts }) });
  } catch (e) { /* offline — local copy is already updated */ }
}

function mealConfirmHtml() {
  let rows = "";
  pendingItems.forEach((it, i) => {
    rows += `<div class="mc-item">
      <input class="mc-name" data-i="${i}" data-f="name" value="${escAttr(it.name)}" placeholder="Food">
      <div class="mc-row">
        <input class="mc-qty" data-i="${i}" data-f="qty" inputmode="decimal" value="${escAttr(String(it.qty))}" placeholder="amount">
        <input class="mc-unit" data-i="${i}" data-f="unit" value="${escAttr(it.unit)}" placeholder="g">
        <button class="mc-del" data-del="${i}">✕</button>
      </div>
    </div>`;
  });
  const chips = OIL_CHOICES.map(([v, l]) =>
    `<button class="oilchip ${pendingOil === v ? "on" : ""}" data-oil="${v}">${l}</button>`).join("");
  return `<div class="mealconfirm">
    <div class="mc-title">${pendingReplaceTs ? "Edit meal" : "Confirm what you ate"}</div>
    <div class="mc-hint">Amounts in grams are used exactly — weigh the main item if you can.</div>
    ${rows}
    <button class="mc-add" id="mcAdd">+ Add item</button>
    <div class="mc-sec">Cooked in oil or butter?</div>
    <div class="oilrow">${chips}</div>
    <textarea class="mc-note" id="mcNote" placeholder="Anything else? e.g. creamy sauce, skin on, restaurant portion">${escHtml(pendingNote)}</textarea>
    <div class="mc-actions">
      <button class="mc-cancel" id="mcCancel">Cancel</button>
      <button class="mc-confirm" id="mcConfirm">${pendingReplaceTs ? "Re-estimate" : "Confirm &amp; estimate"}</button>
    </div>
  </div>`;
}

function renderMeals() {
  const today = isoToday();
  const todays = meals.filter(m => m.date === today);
  const kcal = todays.reduce((a, m) => a + (+m.kcal || 0), 0);
  const prot = todays.reduce((a, m) => a + (+m.protein || 0), 0);

  let html = `<div class="stats">
    <div class="stat"><div class="lbl">Today · calories</div><div class="val">${kcal || 0} <small>/ 2000 kcal</small></div></div>
    <div class="stat"><div class="lbl">Today · protein</div><div class="val">${prot || 0} <small>/ ${PROTEIN_TARGET} g</small></div></div>
  </div>`;

  if (mealStage === "confirming") {
    html += mealConfirmHtml();
  } else if (mealStage === "detecting" || mealStage === "estimating") {
    html += `<div class="mealbusy"><div class="mb-spin"></div>
      <div class="mb-text">${mealStage === "detecting" ? "Detecting what's on the plate…" : "Estimating calories…"}</div></div>`;
  } else {
    html += `<div class="mealacts">
      <label class="mealact">
        <input type="file" accept="image/*" capture="environment" id="mealFile" hidden>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7H7l1.2-1.8a1 1 0 0 1 .83-.45h5.94a1 1 0 0 1 .83.45L17 7h2.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
        <span class="ma-text">Snap a meal</span>
      </label>
      <button class="mealact" id="mealManual">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span class="ma-text">Add manually</span>
      </button>
    </div>`;
  }

  html += `<div class="mealhint" id="mealHint"></div>`;

  if (!meals.length) {
    html += `<div class="empty"><div class="big">No meals logged yet</div>Snap or describe your first meal and it'll show up here.</div>`;
  } else {
    meals.slice(0, 40).forEach(m => {
      const d = new Date(m.ts);
      const tt = isNaN(d.getTime()) ? "" : d.toLocaleString(undefined, { weekday:"short", hour:"numeric", minute:"2-digit" });
      if (+m.ts === +mealDeleteTs) {
        html += `<div class="mealentry">
          <div class="me-top"><span class="me-label">${escHtml(m.label || "meal")}</span><span class="me-time">${tt}</span></div>
          <div class="me-delconfirm">
            <span class="me-delq">Delete this meal?</span>
            <button class="me-delyes" data-mealdelyes="${m.ts}">Delete</button>
            <button class="me-delno" data-mealdelno="1">Cancel</button>
          </div>
        </div>`;
      } else {
        // Tap a meal to see where its calories come from, and to fix it
        let brk = "";
        if (+m.ts === +mealOpenTs) {
          brk = `<div class="me-break">` + (m.items && m.items.length
            ? m.items.map(it => `<div class="mb-row"><span class="mb-name">${escHtml(it.name)}${it.grams ? " · " + it.grams + " g" : ""}</span><span class="mb-val">${it.kcal} kcal · ${it.protein_g} g${+it.added_sugar_g > 0 ? ` · <span class="mb-sugar">${it.added_sugar_g} g sugar</span>` : ""}</span></div>`).join("")
            : `<div class="mb-none">No item breakdown — this meal was logged before itemised estimates.</div>`)
            + `<button class="me-edit" data-mealedit="${m.ts}">Edit &amp; re-estimate</button></div>`;
        }
        html += `<div class="mealentry tap" data-mealopen="${m.ts}">
          <div class="me-top"><span class="me-label">${escHtml(m.label || "meal")}</span>
            <span class="me-right"><span class="me-time">${tt}</span><button class="me-del" data-mealdel="${m.ts}" aria-label="Delete meal">✕</button></span></div>
          <div class="me-macros"><span class="me-mac"><b>${m.kcal || "–"}</b> kcal</span><span class="me-mac"><b>${m.protein || "–"}</b> g protein</span>${m.sugar != null ? `<span class="me-mac"><b>${Math.round(m.sugar)}</b> g added sugar</span>` : ""}</div>
          ${brk}
        </div>`;
      }
    });
  }

  view.innerHTML = html;

  // Delete controls on logged meals (active in any stage)
  view.querySelectorAll("[data-mealdel]").forEach(b => b.onclick = (e) => { e.stopPropagation(); mealDeleteTs = +b.dataset.mealdel; renderMeals(); });
  view.querySelectorAll("[data-mealdelyes]").forEach(b => b.onclick = () => deleteMeal(+b.dataset.mealdelyes));
  view.querySelectorAll("[data-mealdelno]").forEach(b => b.onclick = () => { mealDeleteTs = null; renderMeals(); });
  view.querySelectorAll("[data-mealopen]").forEach(el => el.onclick = () => {
    const ts = +el.dataset.mealopen;
    mealOpenTs = (+mealOpenTs === ts) ? null : ts;
    renderMeals();
  });
  view.querySelectorAll("[data-mealedit]").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    if (mealStage !== "idle") { mealHint("Finish or cancel the meal you're adding first."); return; }
    editMeal(+b.dataset.mealedit);
  });

  if (mealStage === "idle") {
    const file = document.getElementById("mealFile");
    if (file) file.onchange = onMealPhoto;
    const manual = document.getElementById("mealManual");
    if (manual) manual.onclick = startManualMeal;
  } else if (mealStage === "confirming") {
    view.querySelectorAll(".mc-name, .mc-qty, .mc-unit").forEach(el => {
      el.oninput = () => { pendingItems[+el.dataset.i][el.dataset.f] = el.value; };
    });
    const note = document.getElementById("mcNote");
    if (note) note.oninput = () => { pendingNote = note.value; };
    const add = document.getElementById("mcAdd");
    if (add) add.onclick = () => { pendingItems.push({ name:"", qty:"", unit:"g" }); renderMeals(); };
    view.querySelectorAll("[data-oil]").forEach(b => b.onclick = () => { pendingOil = b.dataset.oil; renderMeals(); });
    view.querySelectorAll(".mc-del").forEach(b => b.onclick = () => { pendingItems.splice(+b.dataset.del, 1); renderMeals(); });
    const cf = document.getElementById("mcConfirm"); if (cf) cf.onclick = confirmMeal;
    const cx = document.getElementById("mcCancel"); if (cx) cx.onclick = cancelMeal;
  }
  wireHome();
}

// ---------- Weight tracking (local) ----------
const WEIGHT_KEY = "ulp-weight-v1";
const GOAL_KEY = "ulp-goal-v1";
let WEIGHT_GOAL = 62.5;   // default target; overridden by a saved value if present
function loadGoal() {
  try { const v = localStorage.getItem(GOAL_KEY); if (v != null && !isNaN(+v) && +v > 0) WEIGHT_GOAL = +v; } catch (e) {}
}
function setGoal(kg) {
  WEIGHT_GOAL = kg;
  try { localStorage.setItem(GOAL_KEY, String(kg)); } catch (e) {}
  pushGoalToSheet(kg);
}
function pushGoalToSheet(kg) {
  if (!SHEET_SYNC_URL) return;
  try {
    fetch(SHEET_SYNC_URL, { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "saveGoal", token: APP_TOKEN, kg }) });
  } catch (e) { /* offline — local copy is still saved */ }
}
function applyGoal(g) {
  if (g != null && g !== "" && !isNaN(+g) && +g > 0) {
    WEIGHT_GOAL = +g;
    try { localStorage.setItem(GOAL_KEY, String(WEIGHT_GOAL)); } catch (e) {}
  }
}
function fetchGoal(cb) {
  if (!SHEET_SYNC_URL) { if (cb) cb(); return; }
  jsonp(SHEET_SYNC_URL + "?action=getGoal", (err, payload) => {
    if (!err && payload) applyGoal(payload.goal);
    if (cb) cb();
  });
}
function refreshGoal() { fetchGoal(() => { if (currentTab === "home" || currentTab === "weight") renderIfIdle(); }); }
let weights = [];   // [{date, kg}]
let goalEditing = false;   // is the Goal stat showing its inline editor?

// ---------- Standardised exercise list (from the sheet) ----------
const EXLIST_KEY = "ulp-exlist-v1";
let exerciseList = [];        // [{name, type, sets, lo, hi, note}]
let pickingExercise = false;  // is the routine builder showing the exercise chooser?
function loadExListCache() { try { const v = localStorage.getItem(EXLIST_KEY); if (v) exerciseList = JSON.parse(v); } catch (e) {} }
function applyExercises(list) {
  if (!Array.isArray(list)) return;
  exerciseList = list;
  try { localStorage.setItem(EXLIST_KEY, JSON.stringify(exerciseList)); } catch (e) {}
}
function fetchExercises(cb) {
  if (!SHEET_SYNC_URL) { if (cb) cb(); return; }
  jsonp(SHEET_SYNC_URL + "?action=getExercises", (err, payload) => {
    if (!err && payload) applyExercises(payload.exercises);
    if (cb) cb();
  });
}
function refreshExercises() { fetchExercises(() => { if (currentTab === "edit" && editingDay) renderIfIdle(); }); }
function loadWeightCache() { try { const v = localStorage.getItem(WEIGHT_KEY); if (v) weights = JSON.parse(v); } catch (e) {} }
function cacheWeights() { try { localStorage.setItem(WEIGHT_KEY, JSON.stringify(weights)); } catch (e) {} }
function sortedWeights() { return [...weights].sort((a, b) => a.date.localeCompare(b.date)); }
function logWeight(kg) {
  const date = isoToday();
  const idx = weights.findIndex(w => w.date === date);
  if (idx >= 0) weights[idx].kg = kg; else weights.push({ date, kg });
  cacheWeights();
  pushWeightToSheet(date, kg);
}

// --- Cross-device weight sync (same Google Sheet web app) ---
function pushWeightToSheet(date, kg) {
  if (!SHEET_SYNC_URL) return;
  try {
    fetch(SHEET_SYNC_URL, { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "saveWeight", token: APP_TOKEN, date, kg }) });
  } catch (e) { /* offline — local copy is still saved */ }
}
// Merge sheet weights with any local days the sheet hasn't received yet
function applyWeightRows(rows) {
  const byDate = {};
  rows.forEach(r => {
    const d = String(r[0]).slice(0, 10), kg = +r[1];
    if (d && !isNaN(kg)) byDate[d] = kg;
  });
  // keep any locally-logged days the sheet hasn't received yet, and re-push them
  weights.forEach(w => { if (!(w.date in byDate)) { byDate[w.date] = w.kg; pushWeightToSheet(w.date, w.kg); } });
  weights = Object.keys(byDate).sort().map(d => ({ date: d, kg: byDate[d] }));
  cacheWeights();
}
function fetchWeights(cb) {
  if (!SHEET_SYNC_URL) { if (cb) cb(); return; }
  jsonp(SHEET_SYNC_URL + "?action=getWeights", (err, payload) => {
    if (!err && payload && payload.weights) applyWeightRows(payload.weights);
    if (cb) cb();
  });
}
function refreshWeights() { fetchWeights(() => {
  if (currentTab === "home" || currentTab === "weight") renderIfIdle();
}); }

function renderWeight() {
  const s = sortedWeights();
  const latest = s.length ? s[s.length - 1] : null;
  const prev = s.length > 1 ? s[s.length - 2] : null;
  const cur = latest ? latest.kg : null;
  const dPrev = (latest && prev) ? (latest.kg - prev.kg) : null;
  const toGoal = cur != null ? (cur - WEIGHT_GOAL) : null;

  let html = '';
  const goalCell = goalEditing
    ? `<div class="stat goaledit">
        <div class="lbl">Goal</div>
        <input id="gInput" class="goalinput" inputmode="decimal" value="${WEIGHT_GOAL}">
        <button class="goalsave" id="gSave">Save</button>
      </div>`
    : `<div class="stat goaltap" id="goalStat"><div class="lbl">Goal</div><div class="val">${WEIGHT_GOAL} <small>kg</small></div></div>`;
  html += `<div class="stats">
    <div class="stat"><div class="lbl">Current</div><div class="val">${cur != null ? cur : "\u2014"} <small>kg</small></div></div>
    ${goalCell}
    <div class="stat"><div class="lbl">Since last</div><div class="val" style="font-size:18px">${dPrev != null ? (dPrev > 0 ? "+" : "") + dPrev.toFixed(1) + " kg" : "\u2014"}</div></div>
    <div class="stat"><div class="lbl">To goal</div><div class="val" style="font-size:18px">${toGoal != null ? (toGoal > 0.05 ? toGoal.toFixed(1) + " kg" : "reached") : "\u2014"}</div></div>
  </div>`;

  html += `<div class="card"><h2>Weekly weight log</h2>
    <div class="weighrow">
      <input id="wInput" class="weighinput" inputmode="decimal" placeholder="${cur != null ? cur + " kg" : "e.g. 70.5"}">
      <button class="weighbtn" id="wSave">Save</button>
    </div>
    <div class="mealhint" id="wHint"></div></div>`;

  const pts = s.slice(-14).map(w => ({ label: prettyShort(w.date), value: w.kg }));
  html += `<div class="card"><h2>Weight over time</h2>
    ${scatterChart(pts, { zeroBase: false, target: WEIGHT_GOAL, unit: " kg", empty: "Log your weight to start the trend." })}</div>`;

  if (s.length) {
    html += `<div class="seclabel">Recent entries</div>`;
    [...s].reverse().slice(0, 20).forEach(w => {
      html += `<div class="mealentry"><div class="me-top"><span class="me-label">${w.kg} kg</span><span class="me-time">${prettyDate(w.date)}</span></div></div>`;
    });
  }

  view.innerHTML = html;
  const inp = document.getElementById("wInput");
  const btn = document.getElementById("wSave");
  const save = () => {
    const v = parseFloat(inp.value);
    if (isNaN(v) || v <= 0) { document.getElementById("wHint").textContent = "Enter a weight in kg."; return; }
    logWeight(Math.round(v * 10) / 10);
    render();
  };
  btn.onclick = save;
  inp.onkeydown = (e) => { if (e.key === "Enter") save(); };

  if (goalEditing) {
    const gInp = document.getElementById("gInput");
    const gBtn = document.getElementById("gSave");
    const gSave = () => {
      const v = parseFloat(gInp.value);
      if (isNaN(v) || v <= 0) { gInp.focus(); return; }
      setGoal(Math.round(v * 10) / 10);
      goalEditing = false;
      render();
    };
    gBtn.onclick = gSave;
    gInp.onkeydown = (e) => { if (e.key === "Enter") gSave(); else if (e.key === "Escape") { goalEditing = false; render(); } };
    gInp.focus();
    gInp.select();
  } else {
    const gStat = document.getElementById("goalStat");
    if (gStat) gStat.onclick = () => { goalEditing = true; render(); };
  }
  wireHome();
}

// ---------- Tabs + save ----------
document.getElementById("saveBtn").onclick = saveSession;

// ---------- Day rollover ----------
// If the app is left open across midnight, "today" goes stale. Re-render
// (and re-pull meals) whenever the local date changes — on a timer, when the
// tab regains focus, and when it becomes visible again.
let _lastSeenDay = isoToday();
function checkDayRollover() {
  const now = isoToday();
  if (now !== _lastSeenDay) {
    _lastSeenDay = now;
    render();          // recompute today's totals everywhere
    refreshMeals();    // re-pull so the new day starts clean
  }
}
setInterval(checkDayRollover, 60 * 1000);        // catch midnight while open
// Re-fit the home screen when the phone rotates or the browser bars change size,
// and once the web fonts arrive (they can shift text heights slightly)
let _resizeTimer = null;
function refitHomeSoon() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => { if (currentTab === "home") renderIfIdle(); }, 150);
}
window.addEventListener("resize", refitHomeSoon);
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", refitHomeSoon);
window.addEventListener("focus", checkDayRollover);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDayRollover(); });

// ---------- Boot ----------
(async () => {
  await load();
  loadMealsCache();
  loadWeightCache();
  loadGoal();
  loadExListCache();
  buildDraft(currentDay);
  render();              // show cached data instantly
  bootFromSheet();       // then one request pulls everything fresh from the sheet
})();

// ---------- Offline cache (service worker) ----------
// Lets the page itself open instantly from the phone instead of waiting on
// GitHub Pages. Needs sw.js uploaded next to index.html. Updates to
// index.html show up on the open AFTER the one that downloads them.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* sw.js missing — app still works */ });
  });
}
</script>
</body>
</html>
