<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Health Track</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Health Track" />
<meta name="theme-color" content="#F5F6F7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Fonts load without holding up the first screen; system fonts show until they arrive -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" /></noscript>

<style>
  :root {
    --ink: #121417;
    --ink-soft: #565E66;
    --ink-faint: #9AA0A6;
    --paper: #F5F6F7;
    --card: #FFFFFF;
    --line: #E4E6E9;
    --accent: #0E9E90;        /* teal — actions, progression-ready */
    --accent-ink: #0B7268;
    --up: #0B7268;            /* hit the target (teal) */
    --up-bg: #E1F3F0;
    --hold: #565E66;          /* repeat / chase reps (neutral) */
    --hold-bg: #EDEFF1;
    --over: #E5484D;          /* over the calorie target */
    --over-ink: #C2373C;
    --shadow: 0 1px 2px rgba(18,20,23,.05), 0 8px 24px rgba(18,20,23,.06);
    --display: "Space Grotesk", system-ui, sans-serif;
    --body: "Inter", system-ui, sans-serif;
    --mono: "Space Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: var(--body);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
  body.logbar .app { padding-bottom: 120px; }   /* room for the Save bar on the Log tab only */
  /* Home: fill the screen and pin the buttons to the bottom */
  body.home .app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  body.home #view { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .card.protcard { padding: 12px 14px 13px; margin-bottom: 9px; }
  .card.protcard h2 { margin: 0; }

  /* ---- Header ---- */
  header { padding: 2px 2px 10px; }
  .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-faint); font-weight: 700;
  }
  h1 {
    font-family: var(--display); font-weight: 700; font-size: 27px;
    margin: 2px 0 0; letter-spacing: -.01em; color: var(--accent); cursor: pointer;
  }
  .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }

  /* ---- Tabs ---- */
  .tabs { display: flex; gap: 6px; margin: 16px 0 14px; }
  .tab {
    flex: 1; border: none; background: transparent; font-family: var(--display);
    font-weight: 600; font-size: 12px; color: var(--ink-soft);
    padding: 9px 1px; border-radius: 10px; cursor: pointer; transition: .15s;
  }
  .tab.on { background: var(--ink); color: #fff; }

  /* ---- Day selector ---- */
  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .day {
    border: 1.5px solid var(--line); background: var(--card); border-radius: 13px;
    padding: 12px 13px; text-align: left; cursor: pointer; transition: .15s;
    box-shadow: var(--shadow);
  }
  .day.on { border-color: var(--ink); }
  .day .dname { font-family: var(--display); font-weight: 700; font-size: 15px; }
  .day .dfocus { font-size: 11px; color: var(--ink-soft); margin-top: 1px; }
  .day .dlast { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-top: 6px; }

  /* ---- Exercise card ---- */
  .ex {
    background: var(--card); border-radius: 15px; padding: 15px 15px 13px;
    margin-bottom: 11px; box-shadow: var(--shadow);
  }
  .ex-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ex-name { font-family: var(--display); font-weight: 700; font-size: 15.5px; letter-spacing: -.01em; }
  .ex-target { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .ex-note { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
  .ex-last { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--ink); margin-top: 7px; }
  .ex-last span { font-weight: 400; color: var(--ink-faint); margin-right: 4px; }

  /* ---- Log: routine picker + header ---- */
  .logpick { font-family: var(--display); font-weight: 700; font-size: 14px; margin: 2px 2px 10px; }
  .day .dlast.going { color: var(--accent-ink); font-weight: 700; }
  .loghead { margin: 0 2px 14px; }
  .lh-name { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
  .lh-focus { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }

  /* ---- History: delete ---- */
  .hdel { width: 100%; margin-top: 10px; border: 1.5px dashed var(--line); background: transparent; border-radius: 10px;
    padding: 9px; font-family: var(--display); font-weight: 600; font-size: 12.5px; color: var(--ink-soft); cursor: pointer; }
  .hdel:active { background: var(--hold-bg); }

  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono);
    font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 20px; margin-top: 9px;
  }
  .chip.up { background: var(--up-bg); color: var(--up); }
  .chip.hold { background: var(--hold-bg); color: var(--hold); }
  .chip.new { background: #ECEEF1; color: var(--ink-soft); }

  .sets { margin-top: 11px; display: flex; flex-direction: column; gap: 7px; }
  .set-row { display: grid; grid-template-columns: 22px 1fr 1fr; gap: 8px; align-items: center; }
  .set-no { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); font-weight: 700; }
  .field { position: relative; }
  .field input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 11px 38px 11px 12px; font-family: var(--mono); font-size: 15px; font-weight: 700;
    color: var(--ink); background: #FBFBFC; outline: none; transition: .15s;
  }
  .field input:focus { border-color: var(--accent); background: #fff; }
  .field .unit {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint); pointer-events: none;
  }
  .set-head { display: grid; grid-template-columns: 22px 1fr 1fr; gap: 8px; margin-bottom: -2px; }
  .set-head span { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .set-head span:first-child { visibility: hidden; }

  .setctl { display: flex; gap: 8px; margin-top: 10px; }
  .setbtn {
    flex: 1; border: 1.5px dashed var(--line); background: transparent; border-radius: 10px;
    padding: 9px; font-family: var(--display); font-weight: 600; font-size: 12.5px;
    color: var(--ink-soft); cursor: pointer; transition: .15s;
  }
  .setbtn:disabled { opacity: .35; cursor: default; }
  .setbtn.add { color: var(--accent-ink); border-color: rgba(14,158,144,.35); }
  .setbtn.add:active { background: rgba(14,158,144,.06); }

  /* ---- Save bar ---- */
  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--paper) 70%, rgba(238,239,241,0));
  }
  .savebar .inner { max-width: 480px; margin: 0 auto; }
  .btn {
    width: 100%; border: none; border-radius: 13px; padding: 15px; cursor: pointer;
    font-family: var(--display); font-weight: 700; font-size: 15px; transition: .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 16px rgba(14,158,144,.28); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { background: var(--ink-faint); box-shadow: none; }
  .savehint { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 7px; min-height: 14px; }

  /* ---- History ---- */
  .hentry { background: var(--card); border-radius: 14px; padding: 13px 15px; margin-bottom: 9px; box-shadow: var(--shadow); cursor: pointer; }
  .hentry-top { display: flex; justify-content: space-between; align-items: center; }
  .hday { font-family: var(--display); font-weight: 700; font-size: 14.5px; }
  .hdate { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .hbody { margin-top: 9px; display: none; }
  .hbody.open { display: block; }
  .hex { display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  .hex:first-child { border-top: none; }
  .hex .hn { color: var(--ink-soft); }
  .hex .hv { font-family: var(--mono); font-weight: 700; font-size: 12px; }

  .empty { text-align: center; padding: 50px 20px; color: var(--ink-soft); }
  .empty .big { font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--ink); margin-bottom: 6px; }

  /* ---- Progress ---- */
  .pcard { background: var(--card); border-radius: 14px; padding: 14px 15px; margin-bottom: 9px; box-shadow: var(--shadow); }
  .pname { font-family: var(--display); font-weight: 700; font-size: 14px; margin-bottom: 9px; }
  .ptrack { display: flex; align-items: flex-end; gap: 5px; height: 56px; }
  .pbar { flex: 1; background: #ECEEF1; border-radius: 5px 5px 0 0; position: relative; min-height: 4px; }
  .pbar.last { background: var(--accent); }
  .pbar .pv { position: absolute; top: -16px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 9.5px; color: var(--ink-soft); }
  .pdates { display: flex; gap: 5px; margin-top: 4px; }
  .pdates span { flex: 1; text-align: center; font-family: var(--mono); font-size: 9px; color: var(--ink-faint); }

  /* ---- Dashboard ---- */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--card); border-radius: 14px; padding: 13px 14px; box-shadow: var(--shadow); }
  .stat .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .stat .val { font-family: var(--display); font-weight: 700; font-size: 23px; margin-top: 3px; letter-spacing: -.01em; }
  .stat .val small { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .card { background: var(--card); border-radius: 16px; padding: 15px 15px 13px; margin-bottom: 11px; box-shadow: var(--shadow); }
  .card h2 { font-family: var(--display); font-weight: 700; font-size: 15px; margin: 0 0 2px; }
  .card .csub { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 12px; }
  .chart { width: 100%; height: auto; display: block; }
  .axis { font-family: var(--mono); font-size: 9px; fill: var(--ink-faint); }
  .seclabel { font-family: var(--display); font-weight: 700; font-size: 14px; margin: 16px 2px 9px; }

  /* ---- Home hub ---- */
  .dotval { font-family: var(--mono); font-size: 10px; fill: var(--accent-ink); font-weight: 700; }
  .chartempty { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); padding: 8px 2px; }
  .navgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .navgrid .navtile { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 56px; }
  .navtile { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 15px; padding: 15px 14px; cursor: pointer; box-shadow: var(--shadow); transition: .15s; position: relative; color: var(--ink); }
  .navtile:active { transform: translateY(1px); }
  .navtile.wide { grid-column: 1 / -1; }
  .navtile::after { content: "\203a"; position: absolute; top: 12px; right: 14px; color: var(--ink-faint); font-family: var(--display); font-size: 16px; }
  .navtile::after { content: none; }
  .navgrid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 9px; }
  .navgrid3 .navtile { padding: 14px 12px; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 56px; }
  .navgrid3 .nt-name { font-size: 14px; }
  .nt-name { display: block; font-family: var(--display); font-weight: 700; font-size: 15.5px; letter-spacing: -.01em; }
  .nt-sub { display: block; font-size: 11.5px; color: var(--ink); margin-top: 2px; }
  .stats.four { grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 9px; }
  .stats.four .stat { padding: 9px 7px; border-radius: 11px; text-align: center; }
  .stats.four .stat .lbl { font-size: 8px; letter-spacing: .03em; }
  .stats.four .stat .val { font-size: 16px; margin-top: 2px; }
  .stats.four .stat .val small { font-size: 8.5px; }
  .card.today { padding: 12px 14px; margin-bottom: 9px; }
  .td-row { display: flex; align-items: center; gap: 12px; }
  .td-main { flex: 1; min-width: 0; }
  .td-lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .td-name { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; margin-top: 1px; line-height: 1.25; }
  .td-sub { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .td-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .td-meta.done { color: var(--accent-ink); font-weight: 700; }
  .td-go { border: none; background: var(--accent); color: #fff; border-radius: 11px; padding: 11px 18px; font-family: var(--display); font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(14,158,144,.25); flex-shrink: 0; }
  .td-go:active { transform: translateY(1px); }
  .td-div { height: 1px; background: var(--line); margin: 10px 0 8px; }
  .td-prow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .td-pv { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .td-pv b { font-size: 14px; color: var(--ink); }
  .td-pv .done { color: var(--accent-ink); font-weight: 700; }
  .td-bar { height: 8px; background: #ECEEF1; border-radius: 5px; margin-top: 6px; overflow: hidden; }
  .navrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .navrow .navtile { display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px 2px; min-height: 46px; border-radius: 13px; }
  .navrow .nt-name { font-size: 13px; }
  .navrow.two { grid-template-columns: 1fr 1fr; }
  .navrow.three { grid-template-columns: repeat(3, 1fr); margin-top: 6px; }
  .navrow.two .nt-name, .navrow.three .nt-name { font-size: 14px; }
  .td-bar span { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .3s; }
  .td-bar.over span { background: var(--over); }
  .td-pv .over, .td-pv b.over { color: var(--over-ink); font-weight: 700; }
  .td-prow.sugarrow { margin-top: 12px; }
  .chartgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 9px; }
  .chartgrid .card { margin-bottom: 0; padding: 13px 13px 10px; }
  .chartgrid .card h2 { font-size: 13px; }
  .chartgrid .card .csub { margin-bottom: 8px; }

  /* ---- Weight ---- */
  .weighrow { display: flex; gap: 8px; }
  .weighinput { flex: 1; border: 1.5px solid var(--line); border-radius: 11px; padding: 12px 13px; font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--ink); background: #FBFBFC; outline: none; }
  .weighinput:focus { border-color: var(--accent); background: #fff; }
  .weighbtn { border: none; background: var(--accent); color: #fff; border-radius: 11px; padding: 12px 20px; font-family: var(--display); font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(14,158,144,.25); }
  .weighbtn:active { transform: translateY(1px); }
  .stat.goaltap { cursor: pointer; position: relative; }
  .stat.goaltap:active { background: #FBFBFC; }
  .stat.goaledit { grid-column: 1 / -1; }
  .goalinput { width: 100%; margin-top: 7px; border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 10px; font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--ink); background: #fff; outline: none; }
  .goalinput:focus { border-color: var(--accent); }
  .goalsave { width: 100%; margin-top: 7px; border: none; background: var(--accent); color: #fff; border-radius: 9px; padding: 9px; font-family: var(--display); font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(14,158,144,.25); }
  .goalsave:active { transform: translateY(1px); }

  /* ---- Exercise progress (in History) ---- */
  .excol { margin-bottom: 9px; }
  .exhead { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 15px; cursor: pointer; box-shadow: var(--shadow); text-align: left; }
  .exhead:active { transform: translateY(1px); }
  .exh-name { font-family: var(--display); font-weight: 700; font-size: 14.5px; }
  .exh-day { font-size: 11px; color: var(--ink-faint); }
  .exh-w { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .exbody { display: none; background: var(--card); border-radius: 14px; padding: 10px 12px 12px; box-shadow: var(--shadow); margin-top: 7px; }
  .exbody.open { display: block; }

  /* ---- Meals ---- */
  .mealsnap { display:flex; flex-direction:column; align-items:center; gap:3px; width:100%;
    border:1.5px dashed rgba(14,158,144,.4); background:rgba(14,158,144,.04); border-radius:16px;
    padding:22px 16px; cursor:pointer; margin-bottom:14px; text-align:center; }
  .mealsnap:active { background:rgba(14,158,144,.08); }
  .ms-text { font-family:var(--display); font-weight:700; font-size:15px; color:var(--accent-ink); margin-top:4px; }
  .ms-sub { font-size:11.5px; color:var(--ink-soft); }
  .mealacts { display:flex; gap:10px; margin-bottom:14px; }
  .mealact { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    border:1.5px dashed rgba(14,158,144,.4); background:rgba(14,158,144,.04); border-radius:16px;
    padding:20px 12px; cursor:pointer; text-align:center; font:inherit; }
  .mealact:active { background:rgba(14,158,144,.08); }
  .ma-text { font-family:var(--display); font-weight:700; font-size:14px; color:var(--accent-ink); margin-top:3px; }
  .ma-sub { font-size:10.5px; color:var(--ink-soft); line-height:1.3; }
  .mealhint { text-align:center; font-size:11.5px; color:var(--ink-soft); min-height:14px; margin:-6px 0 12px; }
  .mealentry { background:var(--card); border-radius:14px; padding:13px 15px; margin-bottom:9px; box-shadow:var(--shadow); }
  .me-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .me-right { display:flex; align-items:baseline; gap:9px; flex-shrink:0; }
  .me-del { border:none; background:transparent; color:var(--ink-faint); font-size:13px; line-height:1; padding:3px 5px; cursor:pointer; border-radius:6px; }
  .me-del:active { background:var(--hold-bg); color:var(--ink-soft); }
  .me-delconfirm { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .me-delq { font-size:12.5px; color:var(--ink); font-weight:600; flex:1; }
  .me-delyes { border:none; background:var(--accent); color:#fff; border-radius:9px; padding:8px 14px; font-family:var(--display); font-weight:700; font-size:12.5px; cursor:pointer; }
  .me-delno { border:1.5px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:9px; padding:8px 14px; font-family:var(--display); font-weight:600; font-size:12.5px; cursor:pointer; }
  .me-label { font-family:var(--display); font-weight:700; font-size:14.5px; }
  .me-time { font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }
  .me-macros { display:flex; gap:16px; margin-top:7px; }
  .me-mac { font-size:12px; color:var(--ink-soft); }
  .me-mac b { font-family:var(--mono); font-size:14px; color:var(--ink); font-weight:700; }
  .mealbusy { display:flex; flex-direction:column; align-items:center; gap:10px; padding:28px 16px; margin-bottom:14px; background:var(--card); border-radius:16px; box-shadow:var(--shadow); }
  .mb-spin { width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:mbspin .8s linear infinite; }
  @keyframes mbspin { to { transform:rotate(360deg); } }
  .mb-text { font-family:var(--display); font-weight:600; font-size:13.5px; color:var(--ink-soft); }

<div class="app">
  <header>
    <h1 id="homeTitle">Health Track</h1>

  <div id="view"><div class="loading">Loading your log…</div></div>
</div>

<div class="savebar" id="savebar" style="display:none">

    <button class="btn btn-primary" id="saveBtn">Save session</button>
    <div class="savehint" id="saveHint"></div>
  </div>
</div>

<script>
// ---------- Standalone storage ----------
// Inside Claude, window.storage exists. On its own, fall back to the
// browser's localStorage so the same file works either place.
if (!window.storage) {
  window.storage = {
    async get(key)        { const v = localStorage.getItem(key); return v == null ? null : { key, value: v }; },
    async set(key, value) { localStorage.setItem(key, value); return { key, value }; },
    async delete(key)     { localStorage.removeItem(key); return { key, deleted: true }; },
    async list(prefix="") { const keys = Object.keys(localStorage).filter(k => k.startsWith(prefix)); return { keys, prefix }; },
  };
}

const STORE_KEY = "ulp-tracker-v1";

// ====== GOOGLE SHEET SYNC (optional) ======
// Paste your Apps Script web-app URL between the quotes to turn on
// auto-saving to your Google Sheet. Leave it empty to keep sync off.
const SHEET_SYNC_URL = "https://script.google.com/macros/s/AKfycbxB6ZMyoix4ygEgL5TzXNN0uNX_bVd9uy5D_bKDwy0Z9i3sZSE7z7crlOI3LqIcBKft/exec";
const APP_TOKEN = "k7mPq2xRv9tLw4nB8sZ";
// ==========================================

// Single-user mode: the old name + PIN login is gone. Clear its saved login
// so nothing from the multi-user version lingers on this device.
try { localStorage.removeItem("ulp-user-v1"); } catch (e) {}

// ---------- The plan ----------
const DEFAULT_PLAN = {
  "Upper A": { focus: "Push — chest, shoulders, triceps", ex: [
    { id:"chestpress", name:"Chest press machine", sets:3, lo:8, hi:10, type:"kg", note:"Seat so handles line up with mid-chest." },
    { id:"seatedrow",  name:"Seated row (chest pad)", sets:3, lo:8, hi:12, type:"kg", note:"Chest on the pad, back protected." },
    { id:"shoulderpress", name:"Shoulder press machine", sets:3, lo:8, hi:12, type:"kg" },
    { id:"latraise", name:"Lateral raise machine", sets:3, lo:12, hi:15, type:"kg", note:"Go light — these humble everyone." },
    { id:"tripush", name:"Triceps pushdown (cable)", sets:3, lo:12, hi:15, type:"kg" },
  ]},
  "Lower A": { focus: "Quads · hamstrings · core", ex: [
    { id:"legpress", name:"Leg press", sets:3, lo:10, hi:12, type:"kg", note:"Back & hips on the pad — don't let your lower back curl off at the bottom." },
    { id:"legext", name:"Leg extension", sets:3, lo:12, hi:12, type:"kg" },
    { id:"legcurl", name:"Seated leg curl", sets:3, lo:12, hi:12, type:"kg" },
    { id:"calf", name:"Calf raises", sets:2, lo:15, hi:20, type:"kg" },
    { id:"deadbug", name:"Dead bug", sets:2, lo:8, hi:10, type:"bw", note:"Resist the movement, don't crunch." },
    { id:"sideplank", name:"Side plank", sets:2, lo:20, hi:30, type:"sec", note:"Per side. Hips stacked." },
  ]},
  "Upper B": { focus: "Pull — back, biceps, rear delts", ex: [
    { id:"latpull", name:"Lat pulldown", sets:3, lo:8, hi:12, type:"kg" },
    { id:"cablerow", name:"Seated cable row", sets:3, lo:10, hi:12, type:"kg", note:"Sit tall — pull to your stomach without rocking back." },
    { id:"pressany", name:"Chest or shoulder press", sets:3, lo:10, hi:12, type:"kg", note:"Whichever machine is free." },
    { id:"facepull", name:"Face pulls", sets:3, lo:15, hi:15, type:"kg", note:"Great for posture if you sit a lot." },
    { id:"bicep", name:"Cable bicep curls", sets:3, lo:10, hi:12, type:"kg" },
  ]},
  "Lower B": { focus: "Glutes · hamstrings · calves · core", ex: [
    { id:"hipthrust", name:"Hip thrust machine", sets:3, lo:10, hi:12, type:"kg", note:"Bodyweight bridges if no machine. No spinal load." },
    { id:"legpresshigh", name:"Leg press (feet high)", sets:3, lo:10, hi:12, type:"kg", note:"Higher feet shift work to glutes & hams." },
    { id:"legcurlb", name:"Lying / seated leg curl", sets:3, lo:12, hi:12, type:"kg" },
    { id:"hipab", name:"Hip abduction machine", sets:2, lo:12, hi:15, type:"kg", note:"Glute med — side-hip strength supports the lower back." },
    { id:"calfb", name:"Calf raises", sets:2, lo:15, hi:20, type:"kg" },
  ]},
};
let plan = JSON.parse(JSON.stringify(DEFAULT_PLAN));
let DAYS = Object.keys(plan);
function refreshDays() {
  DAYS = Object.keys(plan);
  if (!plan[currentDay]) currentDay = DAYS[0];
}

// ---------- State ----------
let data = { sessions: [] };
let exNameById = {};   // exercise id -> display name, learned from the Log on sync
let currentDay = "Lower A";
let currentTab = "home";
let draft = {};   // { exId: [{w, r}, ...] }
let draftDirty = false;  // has the user typed into the current draft?
let logPicked = false;   // Log tab: has a routine been chosen yet? (routine list shows until then)
let histDeleteKey = null; // History: "date|day" of the workout asking "delete?"
let editingDay = null;   // which day is open in the Edit tab

// ---------- Storage ----------
async function load() {
  try {
    const res = await window.storage.get(STORE_KEY);
    if (res && res.value) data = JSON.parse(res.value);
  } catch (e) { /* empty / first run */ }
  if (!data.sessions) data.sessions = [];
  if (data.plan && Object.keys(data.plan).length) plan = data.plan;
  else data.plan = plan;     // first run / upgrade: store the editable plan
  refreshDays();
  if (!data.seeded) {
    data.seeded = true;
    await persist();   // mark initialised — no demo seed
  }
}
async function persist() {
  try { await window.storage.set(STORE_KEY, JSON.stringify(data)); }
  catch (e) { return false; }
  return true;
}

// Save plan edits locally, then push them to the sheet so other devices get them
function savePlan() { data.plan = plan; persist(); pushPlanToSheet(); }

// --- Cross-device plan sync (via the same Google Sheet web app) ---
function jsonp(url, cb, timeoutMs) {
  const fn = "__cb" + Math.random().toString(36).slice(2);
  let done = false;
  const cleanup = () => { delete window[fn]; sc.remove(); clearTimeout(timer); };
  window[fn] = (d) => { if (done) return; done = true; cleanup(); cb(null, d); };
  const sc = document.createElement("script");
  sc.src = url + (url.includes("?") ? "&" : "?") + "callback=" + fn + "&t=" + Date.now();
  sc.onerror = () => { if (done) return; done = true; cleanup(); cb(new Error("net")); };
  const timer = setTimeout(() => { if (done) return; done = true; cleanup(); cb(new Error("timeout")); }, timeoutMs || 12000);
  document.body.appendChild(sc);
}
let _planPushTimer = null;
function pushPlanToSheet() {
  if (!SHEET_SYNC_URL) return;
  clearTimeout(_planPushTimer);
  _planPushTimer = setTimeout(() => {
    try {
      fetch(SHEET_SYNC_URL, { method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ plan: JSON.stringify(plan) }) });
    } catch (e) { /* offline — local copy is still saved */ }
  }, 1200);
}

// Re-render with fresh data, unless the user is mid-typing (which would
// steal focus) or mid-way through a meal flow. Their next tap re-renders.
function renderIfIdle() {
  const a = document.activeElement;
  if (a && view.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if (currentTab === "meals" && mealStage !== "idle") return;
  render();
}

// Apply the routine (Plan) + session history (Log) from a sheet payload.
// The sheet is the source of truth for history — local storage is only an
// offline fallback, overwritten here whenever the sheet is reachable.
function applyLogAndPlan(payload) {
  // 1) Routine first, so exercise ids resolve against the current plan
  if (payload.plan) {
    let remote;
    try { remote = JSON.parse(payload.plan); } catch (e) { remote = null; }
    if (remote && Object.keys(remote).length && JSON.stringify(remote) !== JSON.stringify(plan)) {
      plan = remote; data.plan = plan;
    }
  } else {
    pushPlanToSheet();   // seed the sheet from this device
  }
  refreshDays();
  if (editingDay && !plan[editingDay]) editingDay = null;
  // 2) History from the Log tab
  const sess = reconstructSessions(payload.rows);
  if (sess) { data.sessions = sess; }
  persist();
  // Don't wipe sets the user has already typed in
  if (draftDirty) reconcileDraft(currentDay); else buildDraft(currentDay);
}
function syncFromSheet() {
  if (!SHEET_SYNC_URL) return;
  jsonp(SHEET_SYNC_URL, (err, payload) => {
    if (err || !payload) return;
    applyLogAndPlan(payload);
    renderIfIdle();
  });
}

// One request on startup instead of five: log, plan, meals, weights, goal
// and the exercise list all come back together, then we render once.
function bootFromSheet() {
  if (!SHEET_SYNC_URL) return;
  jsonp(SHEET_SYNC_URL + "?action=boot", (err, payload) => {
    if (err || !payload || !payload.boot) {
      // Older backend or a network hiccup — fall back to the individual pulls
      syncFromSheet(); refreshMeals(); refreshWeights(); refreshGoal(); fetchExercises();
      return;
    }
    applyLogAndPlan(payload);
    if (Array.isArray(payload.meals)) { meals = mapMealRows(payload.meals); cacheMeals(); }
    if (Array.isArray(payload.weights)) applyWeightRows(payload.weights);
    applyGoal(payload.goal);
    applyExercises(payload.exercises);
    renderIfIdle();
  }, 25000);
}

// Turn flat Log rows [date, day, exercise, set, weight, reps] back into sessions.
// Returns null when there's no data, so we never clobber what we have.
function reconstructSessions(rows) {
  if (!rows || rows.length < 2) return null;
  const map = {};
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i]; if (!r) continue;
    const date = (r[0] == null) ? "" : String(r[0]).slice(0, 10);
    const day  = (r[1] == null) ? "" : String(r[1]);
    const name = (r[2] == null) ? "" : String(r[2]);
    if (!date || !day) continue;
    const setNo = parseInt(r[3], 10) || 1;
    const wRaw = r[4], rRaw = r[5];
    const w = (wRaw === "BW" || wRaw === "" || wRaw == null || isNaN(+wRaw)) ? "" : +wRaw;
    const reps = (rRaw === "" || rRaw == null || isNaN(+rRaw)) ? "" : +rRaw;
    const key = date + "|" + day;
    if (!map[key]) map[key] = { date, day, ex: {} };
    const id = resolveExId(day, name);
    exNameById[id] = name;
    if (!map[key].ex[id]) map[key].ex[id] = [];
    map[key].ex[id][setNo - 1] = { w, r: reps };
  }
  return Object.keys(map).map(k => {
    const s = map[k];
    Object.keys(s.ex).forEach(id => { s.ex[id] = s.ex[id].map(x => x || { w: "", r: "" }); });
    return s;
  }).sort((a, b) => a.date.localeCompare(b.date));
}
// Map a logged exercise name back to a stable id, preferring the current plan.
function resolveExId(day, name) {
  const dp = plan[day];
  if (dp) { const f = dp.ex.find(e => (e.name || "") === name); if (f) return f.id; }
  for (const k of DAYS) { const f = plan[k].ex.find(e => (e.name || "") === name); if (f) return f.id; }
  return slug(name);
}
function slug(name) {
  const s = String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
  return s ? "ex_" + s.slice(0, 40) : "ex_" + Date.now().toString(36);
}
function uid() { return "ex" + Date.now().toString(36) + Math.floor(Math.random()*1000); }
function escHtml(t){return String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escAttr(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// Mirror the whole log into your Google Sheet (fire-and-forget).
// localStorage stays the source of truth, so a failed sync never loses data.
async function syncToSheet() {
  if (!SHEET_SYNC_URL) return;
  const rows = sessionRows();   // every exercise, even ones since removed from a routine
  try {
    await fetch(SHEET_SYNC_URL, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ rows })
    });
  } catch (e) { /* offline or blocked — localStorage still has everything */ }
}

// Seed: today's Lower A calibration session
function seed() {
  const today = isoToday();
  data.sessions.push({
    date: today, day: "Lower A",
    ex: {
      legpress: [{w:10,r:10},{w:10,r:10},{w:10,r:12}],
      legext:   [{w:10,r:10},{w:10,r:10},{w:10,r:10}],
      legcurl:  [{w:10,r:12},{w:10,r:12},{w:10,r:12}],
      calf:     [{w:20,r:12},{w:20,r:12}],
      deadbug:  [{w:0,r:9},{w:0,r:9}],
      sideplank:[{w:0,r:20},{w:0,r:20}],
    }
  });
}

// ---------- Helpers ----------
function isoToday() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());   // shift to local, then read the date
  return d.toISOString().slice(0, 10);
}
function prettyDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" });
}
function lastSession(day) {
  const list = data.sessions.filter(s => s.day === day);
  return list.length ? list[list.length - 1] : null;
}
function unitLabel(ex) { return ex.type === "sec" ? "sec" : (ex.type === "bw" ? "reps" : "kg"); }

// Suggestion based on the last time this exercise was done
function suggestion(ex, sets) {
  if (!sets || !sets.length) return { cls:"new", text:"First time — start light" };
  const reps = sets.map(s => +s.r || 0);
  const allTop = reps.every(r => r >= ex.hi);
  const allMin = reps.every(r => r >= ex.lo);
  if (ex.type === "bw" || ex.type === "sec") {
    return allTop ? { cls:"up", text:"Solid — add a set or hold longer" }
                  : { cls:"hold", text:"Repeat — build the time" };
  }
  if (allTop) return { cls:"up", text:"Ready to add weight (≈+2.5 kg)" };
  if (allMin) return { cls:"hold", text:"Hold weight — push the top reps" };
  return { cls:"hold", text:"Hold weight — chase the rep target" };
}

// ---------- Exercise lookups across all sessions ----------
function exNameIn(id) { return exNameById[id] || nameFromPlan(id) || ""; }
function typeFor(id) {
  for (const k of DAYS) { const f = plan[k].ex.find(e => e.id === id); if (f) return f.type; }
  return "kg";
}
// The most recent session (any routine) where this exercise was actually done.
// Matches by id first, then by name — so "Calf raises" in Lower A and Lower B
// count as the same exercise.
function lastForExercise(ex) {
  const sorted = data.sessions.slice().sort((a, b) => b.date.localeCompare(a.date));
  for (const s of sorted) {
    let sets = s.ex && s.ex[ex.id];
    if (!sets && ex.name) {
      const id = Object.keys(s.ex || {}).find(k => exNameIn(k) === ex.name);
      if (id) sets = s.ex[id];
    }
    if (sets && sets.some(x => x && x.r !== "" && x.r != null)) return { date: s.date, sets };
  }
  return null;
}
// "Last · Sat 10 Oct  40 kg × 10, 10, 12"
function lastLineHtml(ex, last) {
  if (!last) return "";
  const done = last.sets.filter(x => x && x.r !== "" && x.r != null);
  if (!done.length) return "";
  let txt;
  if (ex.type === "kg") {
    const ws = done.map(x => (x.w === "" || x.w == null) ? "–" : String(x.w));
    txt = ws.every(w => w === ws[0])
      ? `${ws[0]} kg × ${done.map(x => x.r).join(", ")}`
      : done.map((x, i) => `${ws[i]} kg × ${x.r}`).join(" · ");
  } else if (ex.type === "sec") {
    txt = done.map(x => x.r + "s").join(", ");
  } else {
    txt = done.map(x => x.r).join(", ") + " reps";
  }
  return `<div class="ex-last"><span>Last · ${prettyDate(last.date)}</span> ${escHtml(txt)}</div>`;
}
// Every exercise in a session: current-plan order first, then any that have
// since been removed from the routine (so their history is never lost).
function sessionExercises(s) {
  const out = [], seen = new Set(), dp = plan[s.day];
  if (dp) dp.ex.forEach(ex => { if (s.ex[ex.id]) { out.push({ id: ex.id, name: ex.name, type: ex.type }); seen.add(ex.id); } });
  Object.keys(s.ex || {}).forEach(id => {
    if (seen.has(id)) return;
    out.push({ id, name: exNameIn(id) || id, type: typeFor(id) });
  });
  return out;
}
// Flat Log rows for the sheet / CSV: [date, day, exercise, set, weight, reps]
function sessionRows() {
  const rows = [];
  data.sessions.forEach(s => {
    sessionExercises(s).forEach(ex => {
      s.ex[ex.id].forEach((x, i) => rows.push([s.date, s.day, ex.name, i+1, ex.type==="kg"?(x.w||""):"BW", x.r||""]));
    });
  });
  return rows;
}

// ---------- Build draft for a day (prefilled from the last time each exercise was done) ----------
function rowsForExercise(day, ex) {
  const last = lastForExercise(ex);
  const prev = last && last.sets;
  const n = prev ? prev.length : ex.sets;
  const out = [];
  for (let i = 0; i < n; i++) { const pp = prev && prev[i]; out.push({ w: pp ? pp.w : "", r: pp ? pp.r : "" }); }
  return out;
}
function buildDraft(day) {
  draft = {};
  draftDirty = false;
  plan[day].ex.forEach(ex => { draft[ex.id] = rowsForExercise(day, ex); });
}
// Keep the in-progress draft in step with plan edits without wiping typed values
function reconcileDraft(day) {
  const ids = new Set(plan[day].ex.map(e => e.id));
  Object.keys(draft).forEach(k => { if (!ids.has(k)) delete draft[k]; });
  plan[day].ex.forEach(ex => { if (!draft[ex.id]) draft[ex.id] = rowsForExercise(day, ex); });
}

function caloriesByDay() {
  const byDay = {};
  meals.forEach(m => { if (!m.date) return; byDay[m.date] = (byDay[m.date] || 0) + (+m.kcal || 0); });
  return Object.keys(byDay).sort().map(d => ({ date: d, kcal: Math.round(byDay[d]) }));
}

// Generic scatter plot. points = [{label, value}]
// opts: { target, unit, zeroBase (default true), empty }
function scatterChart(points, opts) {
  opts = opts || {};
  if (!points.length) return `<div class="chartempty">${opts.empty || "Nothing logged yet."}</div>`;
  const W = 320, H = opts.height || 132, padL = 8, padR = 10, padT = 18, padB = 20;
  const vals = points.map(p => p.value);
  let min, max;
  if (opts.zeroBase === false) {
    const lo = Math.min(...vals, opts.target != null ? opts.target : Infinity);
    const hi = Math.max(...vals, opts.target != null ? opts.target : -Infinity);
    const pad = Math.max((hi - lo) * 0.15, 1);
    min = lo - pad; max = hi + pad;
  } else {
    min = 0; max = Math.max(...vals, opts.target || 0, 1);
  }
  const span = (max - min) || 1;
  const n = points.length;
  const x = i => n === 1 ? W / 2 : padL + (i * (W - padL - padR)) / (n - 1);
  const y = v => padT + (1 - (v - min) / span) * (H - padT - padB);
  let target = "";
  if (opts.target != null) {
    const ty = y(opts.target);
    target = `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${W - padR}" y2="${ty.toFixed(1)}" stroke="var(--ink-faint)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
      <text class="axis" x="${(W - padR).toFixed(1)}" y="${(ty - 4).toFixed(1)}" text-anchor="end">${opts.target}${opts.unit || ""}</text>`;
  }
  let linePath = "", areaPath = "";
  const baseY = H - padB;
  points.forEach((p, i) => {
    const px = x(i), py = y(p.value);
    linePath += (i ? " L " : "M ") + px.toFixed(1) + " " + py.toFixed(1);
  });
  areaPath = `M ${x(0).toFixed(1)} ${baseY.toFixed(1)}`;
  points.forEach((p, i) => { areaPath += ` L ${x(i).toFixed(1)} ${y(p.value).toFixed(1)}`; });
  areaPath += ` L ${x(n - 1).toFixed(1)} ${baseY.toFixed(1)} Z`;

  let dots = "", labels = "";
  points.forEach((p, i) => {
    const last = i === n - 1;
    const cx = x(i), cy = y(p.value);
    dots += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${last ? 4 : 3}" fill="${last ? "var(--accent)" : "var(--ink-faint)"}"/>`;
    if (last) {
      const dv = (opts.zeroBase === false) ? p.value : Math.round(p.value).toLocaleString();
      dots += `<text class="dotval" x="${cx.toFixed(1)}" y="${(cy - 8).toFixed(1)}" text-anchor="middle">${dv}${opts.unit || ""}</text>`;
    }
    const show = n <= 8 || i === 0 || last || i === Math.floor(n / 2);
    // Edge labels anchor inward so they aren't clipped
    const anchor = n === 1 ? "middle" : (i === 0 ? "start" : (last ? "end" : "middle"));
    if (show) labels += `<text class="axis" x="${cx.toFixed(1)}" y="${H - 5}" text-anchor="${anchor}">${p.label}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <path d="${areaPath}" fill="var(--accent)" opacity="0.1"/>
    ${target}
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}</svg>`;
}

// Bar chart. points = [{label, value}]; opts: { target, height, empty }
// Any day over the target is red; otherwise the latest bar is teal and earlier
// bars grey. Dashed line at the target.
function barChart(points, opts) {
  opts = opts || {};
  if (!points.length) return `<div class="chartempty">${opts.empty || "Nothing logged yet."}</div>`;
  const W = 320, H = opts.height || 132, padL = 8, padR = 10, padT = 18, padB = 20;
  const n = points.length;
  const max = Math.max(...points.map(p => p.value), opts.target || 0, 1);
  const y = v => padT + (1 - v / max) * (H - padT - padB);
  const slot = (W - padL - padR) / n;
  const bw = Math.min(slot * 0.62, 26);
  const baseY = H - padB;
  let bars = "", labels = "";
  points.forEach((p, i) => {
    const last = i === n - 1;
    const cx = padL + slot * (i + 0.5);
    const top = y(p.value), h = Math.max(baseY - top, p.value > 0 ? 2 : 0);
    const over = opts.target != null && p.value > opts.target;
    const fill = over ? "var(--over)" : (last ? "var(--accent)" : "#DDE0E4");
    bars += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(baseY - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${fill}"/>`;
    if (last) bars += `<text class="dotval" x="${cx.toFixed(1)}" y="${(baseY - h - 5).toFixed(1)}" text-anchor="middle"${over ? ' style="fill:var(--over-ink)"' : ""}>${Math.round(p.value).toLocaleString()}</text>`;
    const show = n <= 8 || i === 0 || last || i === Math.floor(n / 2);
    if (show) labels += `<text class="axis" x="${cx.toFixed(1)}" y="${H - 5}" text-anchor="middle">${p.label}</text>`;
  });
  let target = "";
  if (opts.target != null) {
    const ty = y(opts.target);
    target = `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${W - padR}" y2="${ty.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>
      <text class="axis" x="${padL + 2}" y="${(ty - 4).toFixed(1)}" text-anchor="start" stroke="var(--card)" stroke-width="3" paint-order="stroke">${opts.target}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${baseY}" x2="${W - padR}" y2="${baseY}" stroke="var(--line)" stroke-width="1"/>
    ${bars}${target}${labels}</svg>`;
}

// Per-exercise top working weight over time (used in History)
function nameFromPlan(id) {
  for (const k of DAYS) { const f = plan[k].ex.find(e => e.id === id); if (f) return f.name; }
  return null;
}
function exerciseProgressData() {
  // Pull straight from the (sheet-derived) session log, grouped by exercise
  // NAME so the same movement merges across routines. For each exercise,
  // record the highest weight lifted on each day it was trained.
  const byName = {};   // name -> { name, hist: [{date, w}] }
  data.sessions.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(s => {
    Object.keys(s.ex || {}).forEach(id => {
      const sets = s.ex[id]; if (!sets || !sets.length) return;
      const dayMax = Math.max(...sets.map(x => +x.w || 0));
      if (!(dayMax > 0)) return;   // skip bodyweight / timed exercises
      const name = exNameById[id] || nameFromPlan(id) || id;
      if (!byName[name]) byName[name] = { name, hist: [] };
      // if the same exercise was trained twice on one date, keep the heavier
      const h = byName[name].hist;
      const existing = h.find(x => x.date === s.date);
      if (existing) existing.w = Math.max(existing.w, dayMax);
      else h.push({ date: s.date, w: dayMax });
    });
  });
  return Object.values(byName).map(p => {
    p.hist.sort((a, b) => a.date.localeCompare(b.date));
    return p;
  }).filter(p => p.hist.length).sort((a, b) => a.name.localeCompare(b.name));
}
function exerciseProgressHtml() {
  const prog = exerciseProgressData();
  if (!prog.length) return "";
  let h = `<div class="seclabel">Working weight by exercise</div>`;
  prog.forEach((p, i) => {
    const latest = p.hist[p.hist.length - 1].w;
    const pts = p.hist.slice(-14).map(x => ({ label: prettyShort(x.date), value: x.w }));
    h += `<div class="excol">
      <button class="exhead" data-exkey="${i}">
        <span class="exh-name">${escHtml(p.name)}</span>
        <span class="exh-w">${latest} kg \u203a</span>
      </button>
      <div class="exbody" id="exb-${i}">${scatterChart(pts, { zeroBase: false, unit: " kg", empty: "No data yet." })}</div>
    </div>`;
  });
  return h;
}

// ---------- Home: Today card (next workout + protein) ----------
const PROTEIN_TARGET = 135;   // g per day
const SUGAR_LIMIT = 25;       // g added sugar per day — stay under

function lastDoneDate(day) {
  let d = "";
  data.sessions.forEach(s => { if (s.day === day && s.date > d) d = s.date; });
  return d;
}
// The routine done least recently; never-done routines first; ties in routine order.
function nextWorkout() {
  if (!DAYS.length) return null;
  let pick = DAYS[0], pickDate = lastDoneDate(DAYS[0]);
  DAYS.forEach(day => { const d = lastDoneDate(day); if (d < pickDate) { pick = day; pickDate = d; } });
  return { day: pick, last: pickDate };
}
// Jump straight into a routine on the Log tab (keeps typed sets if it's the one in progress)
function startWorkout(day) {
  if (!plan[day]) return;
  if (day !== currentDay || !draftDirty) { currentDay = day; buildDraft(day); }
  currentTab = "log"; editingDay = null; goalEditing = false; pickingExercise = false; histDeleteKey = null;
  logPicked = true;
  render();
  window.scrollTo(0, 0);
}
function todayCardHtml(today) {
  const inProgress = draftDirty && plan[currentDay];
  const next = inProgress ? { day: currentDay, last: lastDoneDate(currentDay) } : nextWorkout();
  const doneToday = [...new Set(data.sessions.filter(s => s.date === today).map(s => s.day))];

  let workout = "";
  if (next && plan[next.day]) {
    const focus = plan[next.day].focus || "";
    // One line under the name: "✓ Trained today: …" or "focus · last done …"
    const lastTxt = next.last ? `last ${prettyShort(next.last)}` : "not done yet";
    const meta = doneToday.length
      ? `✓ Trained today: ${doneToday.map(escHtml).join(", ")}`
      : (focus ? escHtml(focus) + " · " : "") + lastTxt;
    workout = `<div class="td-row">
      <div class="td-main">
        <div class="td-lbl">${inProgress ? "In progress" : "Next workout"}</div>
        <div class="td-name">${escHtml(next.day)}</div>
        <div class="td-meta${doneToday.length ? " done" : ""}">${meta}</div>
      </div>
      <button class="td-go" id="tdGo" data-day="${escAttr(next.day)}">${inProgress ? "Continue" : "Start"}</button>
    </div>`;
  } else {
    workout = `<div class="td-lbl">Next workout</div><div class="td-sub">Add a routine in Routines to get started.</div>`;
  }

  return `<div class="card today">${workout}</div>`;
}

// Protein + added sugar today: one card, sitting just above the calorie chart
function proteinCardHtml(today) {
  const todays = meals.filter(m => m.date === today);
  const prot = Math.round(todays.reduce((a, m) => a + (+m.protein || 0), 0));
  const pct = Math.min(100, Math.round(prot / PROTEIN_TARGET * 100));
  const left = PROTEIN_TARGET - prot;

  // Added sugar is a limit, not a goal: teal while under, red once over
  const sugar = Math.round(todays.reduce((a, m) => a + (+m.sugar || 0), 0));
  const sPct = Math.min(100, Math.round(sugar / SUGAR_LIMIT * 100));
  const sLeft = SUGAR_LIMIT - sugar;
  const sOver = sugar > SUGAR_LIMIT;

  return `<div class="card protcard">
    <div class="td-prow"><h2>Protein today</h2>
      <span class="td-pv"><b>${prot}</b> / ${PROTEIN_TARGET} g · ${left > 0 ? left + " g to go" : `<span class="done">✓ target hit</span>`}</span></div>
    <div class="td-bar"><span style="width:${pct}%"></span></div>
    <div class="td-prow sugarrow"><h2>Added sugar</h2>
      <span class="td-pv"><b${sOver ? ' class="over"' : ""}>${sugar}</b> / ${SUGAR_LIMIT} g · ${sOver ? `<span class="over">${sugar - SUGAR_LIMIT} g over</span>` : sLeft + " g left"}</span></div>
    <div class="td-bar${sOver ? " over" : ""}"><span style="width:${sPct}%"></span></div>
  </div>`;
}

function renderHome() {
  const sessions = dashSessions();
  const today = isoToday();
  const week = sessions.filter(s => daysAgo(s.date) <= 6).length;
  const last = sessions.length ? sessions[sessions.length - 1] : null;
  const ago = last ? daysAgo(last.date) : null;
  const lastTxt = last ? (ago <= 0 ? "Today" : ago === 1 ? "Yesterday" : ago + " days ago") : "\u2014";
  const kcalToday = meals.filter(m => m.date === today).reduce((a, m) => a + (+m.kcal || 0), 0);
  const sw = sortedWeights();
  const curW = sw.length ? sw[sw.length - 1].kg : null;

  let html = `<div class="stats four">
    <div class="stat"><div class="lbl">Current weight</div><div class="val">${curW != null ? curW : "\u2014"}<small> kg</small></div></div>
    <div class="stat"><div class="lbl">Last 7 days</div><div class="val">${week}</div></div>
    <div class="stat"><div class="lbl">Last trained</div><div class="val" style="font-size:12.5px">${lastTxt}</div></div>
    <div class="stat"><div class="lbl">Calories today</div><div class="val">${Math.round(kcalToday) || 0}<small> /2000</small></div></div>
  </div>`;

  html += todayCardHtml(today);

  const volPts = sessions.slice(-14).map(s => ({ label: prettyShort(s.date), value: s.volume }));
  const wPts = sortedWeights().slice(-14).map(w => ({ label: prettyShort(w.date), value: w.kg }));
  _volPts = volPts; _wPts = wPts;
  html += `<div class="chartgrid">

    <div class="card"><h2>Weight</h2>

  </div>`;

  // Last 7 calendar days (today + previous 6); days with nothing logged show an empty slot
  const kcalByDate = {};
  caloriesByDay().forEach(d => { kcalByDate[d.date] = d.kcal; });

  for (let i = 6; i >= 0; i--) {
